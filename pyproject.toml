[project]
name = "telegram-schedule-bot"
version = "0.1.0"
description = "Telegram bot for university schedule reminders with OPP and English subgroup support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.17.0",
    "aiohttp>=3.9.0",
    "apscheduler>=3.10.4",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.7.0",
    "pytz>=2024.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
